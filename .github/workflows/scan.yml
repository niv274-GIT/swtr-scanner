name: SWTR Range Scanner

on:
  schedule:
    # 06:00 UTC every Sunday ≈ 09:00 Israel (summer) / 08:00 (winter).
    # GitHub cron is UTC-only and can be delayed a few min under load — fine for weekly prep.
    - cron: '0 6 * * 0'
  workflow_dispatch:   # lets you run it manually from the Actions tab (use this to test)

permissions:
  contents: write      # allow the job to commit candidates.json back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # the paced scan takes ~50 min; this is comfortable headroom
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20   # Node 20 has global fetch built in

      - name: Run range scan
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          EXPO_PUSH_TOKEN: ${{ secrets.EXPO_PUSH_TOKEN }}
        run: node scan.js

      - name: Commit candidates.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candidates.json
          git commit -m "Weekly range scan candidates" || echo "No changes to commit"
          git push
